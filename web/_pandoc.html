<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{if(localStorage.getItem('pydevices-theme')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ — micropython-hardware</title>
  <link rel="icon" type="image/svg+xml" href="https://pydevices.github.io/assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://pydevices.github.io/assets/css/site.css">
  <script src="https://pydevices.github.io/assets/js/theme-toggle.js" defer></script>
  <style>
    main.doc { max-width: 52rem; padding: 1.5rem 0 3rem; }
    main.doc h1 { font-family: "Space Grotesk", system-ui, sans-serif; }
    main.doc table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.92rem; }
    main.doc th, main.doc td {
      border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
      padding: 0.5rem 0.6rem; text-align: left; vertical-align: top;
    }
    main.doc pre, main.doc code { font-size: 0.9em; }
    main.doc pre {
      overflow-x: auto;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: color-mix(in srgb, currentColor 8%, transparent);
    }
    .doc-nav { margin: 0 0 1.25rem; font-size: 0.92rem; opacity: 0.85; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="https://pydevices.github.io/">
        <span class="logo"><img src="https://pydevices.github.io/assets/img/logo.svg" alt="" width="30" height="30"></span>
        PyDevices
      </a>
      <nav class="nav">
        <a href="./">hardware</a>
        <a href="https://pydisplay.readthedocs.io">pydisplay docs</a>
        <a href="https://github.com/PyDevices/micropython-hardware">Source</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="wrap doc">
    <p class="doc-nav"><a href="./">← micropython-hardware docs</a></p>
$body$
  </main>
</body>
</html>
