[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices"
version = "0.0.1"
description = "Portable display, audio, event, and timing foundations for the PyDevices ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Brad Barnett", email = "contact@pydevices.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pydevices-displaydev>=0.0.1",
  "pydevices-audiodev>=0.0.1",
  "pydevices-multimer>=0.0.1",
]

[project.optional-dependencies]
events = ["pydevices-eventsys>=0.0.1"]
desktop = ["pydevices-desktop>=0.0.1"]
all = [
  "pydevices-eventsys>=0.0.1",
  "pydevices-desktop>=0.0.1",
]

[project.urls]
Homepage = "https://pydevices.github.io/pydevices/"
Repository = "https://github.com/PyDevices/pydevices"
Documentation = "https://pydevices.github.io/pydevices/"
Issues = "https://github.com/PyDevices/pydevices/issues"

[tool.setuptools]
packages = []
